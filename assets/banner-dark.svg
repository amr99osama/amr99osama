<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Amr Osama, Senior Web Developer</title>
  <desc id="d">Fix, speed up and modernize the website your business depends on. WordPress, WooCommerce, Next.js and performance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a36"/></linearGradient>
    <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="ga"><stop offset="0" stop-color="#6366f1" stop-opacity=".55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb"><stop offset="0" stop-color="#22d3ee" stop-opacity=".4"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
    <clipPath id="clip"><rect width="1200" height="380" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .orb1 { animation: drift1 16s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 19s ease-in-out infinite alternate; }
    .bar  { transform-box: fill-box; transform-origin: left center; animation: load 3.6s cubic-bezier(.22,.8,.24,1) infinite; }
    .pulse{ transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-in-out infinite; }
    .sk   { animation: shimmer 3.6s ease-in-out infinite; }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(60px,30px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-70px,-20px); } }
    @keyframes load   { 0% { transform: scaleX(.06); } 62%,100% { transform: scaleX(1); } }
    @keyframes pulse  { 0%,55% { transform: scale(1); } 66% { transform: scale(1.18); } 80%,100% { transform: scale(1); } }
    @keyframes shimmer{ 0%,40% { opacity:.35; } 70%,100% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <g class="orb1"><circle cx="980" cy="60" r="260" fill="url(#ga)"/></g>
    <g class="orb2"><circle cx="1060" cy="340" r="240" fill="url(#gb)"/></g>
  </g>

  <text x="64" y="92" font-size="16" font-weight="700" letter-spacing="3" fill="#7dd3fc">SENIOR WEB DEVELOPER  ·  CAIRO, EGYPT</text>
  <text x="62" y="170" font-size="72" font-weight="800" letter-spacing="-1.5" fill="url(#nm)">Amr Osama</text>
  <text x="64" y="220" font-size="27" font-weight="500" fill="#c7d2fe">Fix, speed up and modernize</text>
  <text x="64" y="254" font-size="27" font-weight="500" fill="#c7d2fe">the website your business depends on.</text>
  <g>
    <g transform="translate(64 290)"><rect width="134" height="40" rx="20" fill="#1b2550" stroke="#34408a"/><text x="67" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#dbe4ff">WordPress</text></g>
    <g transform="translate(212 290)"><rect width="154" height="40" rx="20" fill="#1b2550" stroke="#34408a"/><text x="77" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#dbe4ff">WooCommerce</text></g>
    <g transform="translate(380 290)"><rect width="114" height="40" rx="20" fill="#1b2550" stroke="#34408a"/><text x="57" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#dbe4ff">Next.js</text></g>
    <g transform="translate(508 290)"><rect width="154" height="40" rx="20" fill="#1b2550" stroke="#34408a"/><text x="77" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#dbe4ff">Performance</text></g>
  </g>

  <!-- browser mock: a site getting faster -->
  <g transform="translate(790 64)">
    <rect width="350" height="252" rx="16" fill="#161e3d" stroke="#2a3566"/>
    <path d="M0 40H350" stroke="#2a3566"/>
    <circle cx="22" cy="20" r="5" fill="#3a4690"/><circle cx="40" cy="20" r="5" fill="#3a4690"/><circle cx="58" cy="20" r="5" fill="#3a4690"/>
    <rect x="86" y="11" width="190" height="18" rx="9" fill="#27316a"/>
    <g class="pulse"><circle cx="318" cy="20" r="11" fill="url(#bar)"/><path d="M319.5 13.5 313 21.5h4.2L316 27l6.5-8.2h-4.2z" fill="#fff"/></g>
    <rect class="sk" x="24" y="62" width="302" height="74" rx="10" fill="#27316a"/>
    <rect class="sk" x="24" y="150" width="190" height="12" rx="6" fill="#3a4690"/>
    <rect class="sk" x="24" y="172" width="260" height="12" rx="6" fill="#27316a"/>
    <rect class="sk" x="24" y="194" width="140" height="12" rx="6" fill="#27316a"/>
    <rect x="24" y="224" width="302" height="8" rx="4" fill="#27316a"/>
    <rect class="bar" x="24" y="224" width="302" height="8" rx="4" fill="url(#bar)"/>
  </g>
</svg>
